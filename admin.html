<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>신청 관리 | TOPZONE</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="blue.css"><link rel="stylesheet" href="enrollment.css?v=1"><script src="config.js?v=1" defer></script><script src="db.js?v=1" defer></script><script src="admin.js?v=1" defer></script></head>
<body class="admin-page"><header class="admin-header"><div class="wrap"><strong>TOPZONE <small>신청 관리</small></strong><a href="./">강의 페이지로 ↗</a></div></header>
<main class="admin-shell"><section id="login-panel" class="admin-login"><p class="eyebrow muted">ADMIN ACCESS</p><h1>관리자 로그인</h1><p>관리자 이메일로 로그인 링크를 받으세요.<br>신청자의 개인정보는 관리자에게만 표시됩니다.</p><form id="admin-login-form"><label class="field">이메일<input type="email" name="email" required autocomplete="username"></label><button class="button" type="submit">이메일로 로그인 링크 받기</button></form><p id="login-notice" class="admin-message" role="status"></p><p id="login-error" class="form-error" role="alert"></p></section>
<section id="dashboard" hidden><div class="admin-heading"><div><p class="eyebrow muted">ACADEMICUS · 10.29</p><h1>특강 신청 내역</h1><p>접수 확인과 상태 변경을 한곳에서 관리합니다.</p></div><div class="admin-toolbar"><button id="refresh-list">새로고침</button><button id="export-csv">현재 목록 CSV</button><button id="admin-logout">로그아웃</button></div></div>
<div class="simulation-note">모든 신청의 결제 상태는 <strong>모의 결제</strong>입니다. 실제 청구 금액은 0원이며, 수강료 납부 여부를 나타내지 않습니다.</div>
<form class="admin-controls" id="admin-search"><input id="search-query" type="search" aria-label="이름 또는 이메일 검색" placeholder="이름 또는 이메일 검색" maxlength="80"><select id="status-filter" aria-label="접수 상태 필터"><option value="">전체 상태</option><option value="received">접수</option><option value="confirmed">확인 완료</option><option value="cancelled">취소</option></select><button type="submit">검색</button></form>
<p class="admin-message" id="list-message" role="status"></p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>신청일시</th><th>신청자</th><th>연락처</th><th>결제수단</th><th>접수 상태</th><th>관리</th></tr></thead><tbody id="application-rows"></tbody></table></div>
<div class="admin-pagination"><button id="previous-page">이전</button><span id="page-number">1 페이지</span><button id="next-page">다음</button></div></section></main>
<dialog id="detail-dialog" class="admin-detail" aria-labelledby="detail-title"><button class="dialog-close" id="close-detail" aria-label="신청 상세 닫기">×</button><p class="eyebrow muted">APPLICATION DETAIL</p><h2 id="detail-title">신청 상세</h2><dl id="detail-info"></dl><form id="detail-form"><label class="field">접수 상태<select name="status"><option value="received">접수</option><option value="confirmed">확인 완료</option><option value="cancelled">취소</option></select></label><label class="field">관리자 메모<textarea name="note" maxlength="2000" placeholder="안내 내용이나 확인 사항을 남겨 주세요."></textarea></label><div class="enroll-actions"><button class="button" type="submit">변경사항 저장</button></div></form><p id="detail-error" class="form-error" role="alert"></p><button id="delete-application" class="danger-button">개인정보 및 신청 내역 삭제</button></dialog>
</body></html>
